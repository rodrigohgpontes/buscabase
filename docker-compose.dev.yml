# Overlay for local iteration. Not used in Coolify.
#   make dev
#
# Bind-mounts source and runs uvicorn --reload + Vite. `make up` stays
# the production-shaped images.

services:
  api:
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/app",
        "--reload-dir",
        "/app/alembic",
      ]
    volumes:
      - snapshot_data:/data/snapshots
      - catalog_data:/data/catalog
      - backup_data:/data/backups
      - ./data/prose:/data/prose:z
      - ./apps/api/app:/app/app:z
      - ./apps/api/alembic:/app/alembic:z
      - ./apps/api/alembic.ini:/app/alembic.ini:ro,z

  web:
    build:
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      VITE_HMR_CLIENT_PORT: "80"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/web:/app:z
      - web_node_modules:/app/node_modules
      - catalog_data:/data/catalog:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  caddy:
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started

volumes:
  web_node_modules:
