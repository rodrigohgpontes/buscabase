name: Recorte bncc-dados

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll GitHub Releases
        id: check
        run: |
          set +e
          python scripts/check_bncc_release.py
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 10 ]; then
            echo "Há um recorte novo. Ingestão deliberada: leia o CHANGELOG e rode make ingest com BNCC_DADOS_TAG."
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 10 ]; then
            exit "$code"
          fi
      - name: Keep ETag if changed
        run: |
          git config user.name "buscabase-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/bncc-dados/ETAG || true
          git diff --cached --quiet || git commit -m "Atualiza ETag das releases do bncc-dados"
          git push || true
