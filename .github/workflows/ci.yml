name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Decoder and evals
        run: |
          cd apps/api && pytest -q tests/test_codes.py tests/test_cloud_ai.py
          cd ../.. && PYTHONPATH=apps/api pytest -q tests/evals/test_unknown_codes.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: apps/web
        run: npm install
      - name: Unit tests
        working-directory: apps/web
        run: npm test -- --run
      - name: Typecheck
        working-directory: apps/web
        run: npm run check

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and env example
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config >/dev/null
          test -f .env.example
          grep -q OPENROUTER_API_KEY .env.example
          grep -q EMBEDDING_MODEL .env.example
          grep -q RERANK_MODEL .env.example
          grep -q GENERATION_MODEL .env.example
          grep -q PERGUNTAR_ENABLED .env.example
          grep -q BNCC_DADOS_TAG .env.example
          grep -q openrouter.ai .env.example
          grep -q google/gemini-embedding-001 .env.example
          grep -q jina/jina-reranker-v3.5 .env.example
          grep -q deepseek/deepseek-v4-flash .env.example
